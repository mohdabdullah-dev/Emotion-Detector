<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emotion Detector</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070a0f;
      --card: #0d1117;
      --card2: #11161d;
      --border: #202832;
      --text: #f5f7fa;
      --muted: #8b96a5;
      --green: #22c55e;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
    }

    .container {
      width: min(1200px, 92%);
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    /* Header */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--green);
    }

    .timestamp {
      font-family: "DM Mono", monospace;
      color: var(--muted);
      font-size: 13px;
    }

    /* Main grid */

    .main-grid {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 24px;
    }

    /* Cards */

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    /* Camera */

    .camera-card {
      min-height: 550px;
    }

    .camera-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    .camera-title {
      font-size: 14px;
      font-weight: 600;
    }

    .camera-status {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .camera-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #020305;
      overflow: hidden;
    }

    .camera-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    .camera-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 5;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      font-family: "DM Mono", monospace;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    .camera-error {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      background: #020305;
      text-align: center;
    }

    .camera-error span:first-child {
      font-size: 40px;
    }

    /* Right panel */

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Emotion */

    .emotion-card {
      padding: 28px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      transition: border-color 0.3s ease;
    }

    .emoji {
      font-size: 72px;
      margin-bottom: 15px;
    }

    .emotion-label {
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .emotion-name {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 15px;
      transition: color 0.3s ease;
    }

    .confidence-text {
      font-family: "DM Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .confidence-track {
      width: 100%;
      height: 7px;
      border-radius: 20px;
      background: #1a2028;
      overflow: hidden;
    }

    .confidence-bar {
      height: 100%;
      width: 0%;
      border-radius: 20px;
      transition:
        width 0.5s ease,
        background 0.3s ease;
    }

    /* Prediction */

    .section-card {
      padding: 22px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .prediction-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .prediction-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "DM Mono", monospace;
      font-size: 12px;
    }

    .prediction-name {
      text-transform: capitalize;
    }

    .prediction-confidence {
      color: var(--muted);
    }

    /* Songs */

    .songs-card {
      margin-top: 24px;
      padding: 22px;
    }

    .songs-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px;
      border-radius: 12px;
      background: var(--card2);
      border: 1px solid var(--border);
      animation: fadeIn 0.4s ease both;
    }

    .song-num {
      font-family: "DM Mono", monospace;
      color: var(--muted);
      font-size: 11px;
    }

    .song-info {
      min-width: 0;
      flex: 1;
    }

    .song-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-icon {
      font-size: 18px;
    }

    /* Status */

    .status {
      margin-top: 24px;
      padding: 14px 17px;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
      flex-shrink: 0;
    }

    .status-dot.error {
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.7);
    }

    /* Animation */

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */

    @media (max-width: 900px) {

      .main-grid {
        grid-template-columns: 1fr;
      }

      .songs-list {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 600px) {

      .container {
        width: 94%;
        padding-top: 20px;
      }

      header {
        margin-bottom: 20px;
      }

      .emotion-name {
        font-size: 32px;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <!-- Header -->

    <header>

      <div class="logo">
        Emotion<span>Detector</span>
      </div>

      <div
        class="timestamp"
        id="timestamp"
      >
        --:--:--
      </div>

    </header>


    <!-- Main -->

    <div class="main-grid">

      <!-- Camera -->

      <div class="card camera-card">

        <div class="camera-header">

          <div class="camera-title">
            Live Camera
          </div>

          <div
            class="camera-status"
            id="cameraStatus"
          >
            Browser Camera
          </div>

        </div>


        <div
          class="camera-wrap"
          id="cameraWrap"
        >

          <video
            id="camera"
            autoplay
            playsinline
            muted
          ></video>

          <canvas
            id="canvas"
            style="display: none;"
          ></canvas>


          <div
            class="camera-error"
            id="cameraError"
            style="display: none;"
          >

            <span>📷</span>

            <span id="cameraErrorText">
              Cannot access camera
            </span>

          </div>


          <div class="camera-overlay">

            <div class="live-badge">

              <div class="live-dot"></div>

              LIVE

            </div>

          </div>

        </div>

      </div>


      <!-- Side Panel -->

      <div class="side-panel">


        <!-- Emotion -->

        <div
          class="emotion-card"
          id="emotionCard"
        >

          <div
            class="emoji"
            id="emoji"
          >
            😐
          </div>

          <div class="emotion-label">
            Detected Emotion
          </div>

          <div
            class="emotion-name"
            id="emotionName"
          >
            Neutral
          </div>

          <div
            class="confidence-text"
            id="confidenceText"
          >
            Confidence: 0%
          </div>

          <div class="confidence-track">

            <div
              class="confidence-bar"
              id="emotionBar"
            ></div>

          </div>

        </div>


        <!-- Top Predictions -->

        <div class="card section-card">

          <div class="section-title">
            Top Predictions
          </div>

          <div
            class="prediction-list"
            id="topPredictions"
          >

            <div class="prediction-row">

              <span class="prediction-name">
                Waiting...
              </span>

              <span class="prediction-confidence">
                --
              </span>

            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- Songs -->

    <div class="card songs-card">

      <div class="section-title">
        Recommended Songs
      </div>

      <div
        class="songs-list"
        id="songsList"
      >

        <div class="song-item">

          <span class="song-num">
            01
          </span>

          <div class="song-info">

            <div class="song-title">
              Waiting for emotion...
            </div>

            <div class="song-artist">
              Detecting your mood
            </div>

          </div>

          <span class="song-icon">
            🎵
          </span>

        </div>

      </div>

    </div>


    <!-- Status -->

    <div class="status">

      <div
        class="status-dot"
        id="statusDot"
      ></div>

      <span id="statusText">
        Initializing camera...
      </span>

    </div>


  </div>


  <!-- JavaScript -->

  <script>

    const emotionColors = {

      angry: '#ef4444',

      disgust: '#84cc16',

      fear: '#a855f7',

      happy: '#facc15',

      neutral: '#94a3b8',

      sad: '#3b82f6',

      surprise: '#f97316'

    };


    const video =
      document.getElementById("camera");

    const canvas =
      document.getElementById("canvas");

    const cameraError =
      document.getElementById("cameraError");

    const cameraErrorText =
      document.getElementById("cameraErrorText");


    let stream = null;

    let isProcessing = false;


    // ------------------------------------------------------------
    // Camera
    // ------------------------------------------------------------

    async function startCamera() {

      try {

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Camera API is not available"
          );

        }


        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              width: {
                ideal: 640
              },

              height: {
                ideal: 480
              },

              facingMode: "user"

            },

            audio: false

          });


        video.srcObject = stream;


        cameraError.style.display = "none";


        updateStatus(
          false,
          "Camera connected · starting detection..."
        );


        video.addEventListener(

          "loadedmetadata",

          () => {

            startDetection();

          },

          {
            once: true
          }

        );


      } catch (error) {

        console.error(
          "Camera error:",
          error
        );


        cameraError.style.display =
          "flex";


        cameraErrorText.textContent =
          "Camera permission denied or unavailable";


        updateStatus(
          true,
          "Cannot access camera"
        );

      }

    }


    // ------------------------------------------------------------
    // Capture frame
    // ------------------------------------------------------------

    async function captureFrame() {

      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {

        return;

      }


      if (isProcessing) {

        return;

      }


      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;


      const context =
        canvas.getContext("2d");


      context.drawImage(

        video,

        0,

        0,

        canvas.width,

        canvas.height

      );


      canvas.toBlob(

        async (blob) => {

          if (!blob) {

            return;

          }


          isProcessing = true;


          try {

            const formData =
              new FormData();


            formData.append(
              "file",
              blob,
              "frame.jpg"
            );


            const response =
              await fetch(

                "/predict",

                {

                  method: "POST",

                  body: formData

                }

              );


            if (!response.ok) {

              throw new Error(
                `Prediction API returned ${response.status}`
              );

            }


            const data =
              await response.json();


            updateEmotion(data);


          } catch (error) {

            console.error(
              "Prediction error:",
              error
            );


            updateStatus(
              true,
              "Prediction API unavailable"
            );


          } finally {

            isProcessing = false;

          }

        },

        "image/jpeg",

        0.8

      );

    }


    // ------------------------------------------------------------
    // Detection loop
    // ------------------------------------------------------------

    function startDetection() {

      captureFrame();


      setInterval(

        captureFrame,

        1000

      );

    }


    // ------------------------------------------------------------
    // Update emotion
    // ------------------------------------------------------------

    function updateEmotion(data) {

      if (!data.face_detected) {

        updateStatus(
          false,
          "Camera connected · looking for face..."
        );

        return;

      }


      const emotion =
        data.emotion;


      const color =
        emotionColors[emotion] ||
        "#94a3b8";


      // Confidence

      document.getElementById(
        "confidenceText"
      ).textContent =
        `Confidence: ${data.confidence}%`;


      // Emotion name

      const emotionName =
        document.getElementById(
          "emotionName"
        );


      emotionName.textContent =
        emotion.charAt(0).toUpperCase() +
        emotion.slice(1);


      emotionName.style.color =
        color;


      // Emoji

      document.getElementById(
        "emoji"
      ).textContent =
        data.emoji;


      // Confidence color

      document.getElementById(
        "confidenceText"
      ).style.color =
        color;


      // Confidence bar

      const bar =
        document.getElementById(
          "emotionBar"
        );


      bar.style.width =
        `${data.confidence}%`;


      bar.style.background =
        color;


      // Card border

      document.getElementById(
        "emotionCard"
      ).style.borderColor =
        color;


      // Top predictions

      const predDiv =
        document.getElementById(
          "topPredictions"
        );


      if (
        data.top_emotions &&
        data.top_emotions.length
      ) {

        predDiv.innerHTML =
          data.top_emotions

            .map(

              item => `

                <div class="prediction-row">

                  <span class="prediction-name">
                    ${item.emotion}
                  </span>

                  <span
                    class="prediction-confidence"
                    style="color:${color}"
                  >
                    ${item.confidence}%
                  </span>

                </div>

              `

            )

            .join("");

      }


      // Songs

      if (
        data.songs &&
        data.songs.length
      ) {

        renderSongs(
          data.songs,
          data.emoji
        );

      }


      // Status

      updateStatus(
        false,
        `Detection active · ${emotion}`
      );

    }


    // ------------------------------------------------------------
    // Songs
    // ------------------------------------------------------------

    function renderSongs(
      songs,
      emoji
    ) {

      const list =
        document.getElementById(
          "songsList"
        );


      list.innerHTML = "";


      songs.forEach(

        (song, i) => {

          const parts =
            song.split(" -- ");


          const title =
            parts[0] || song;


          const artist =
            parts[1] || "";


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "song-item";


          item.style.animationDelay =
            `${i * 0.1}s`;


          item.innerHTML = `

            <span class="song-num">
              ${String(i + 1).padStart(2, "0")}
            </span>

            <div class="song-info">

              <div class="song-title">
                ${title}
              </div>

              ${
                artist
                  ? `
                    <div class="song-artist">
                      ${artist}
                    </div>
                  `
                  : ""
              }

            </div>

            <span class="song-icon">
              ${emoji}
            </span>

          `;


          list.appendChild(item);

        }

      );

    }


    // ------------------------------------------------------------
    // Status
    // ------------------------------------------------------------

    function updateStatus(
      error,
      message
    ) {

      const dot =
        document.getElementById(
          "statusDot"
        );


      const text =
        document.getElementById(
          "statusText"
        );


      if (error) {

        dot.className =
          "status-dot error";

      } else {

        dot.className =
          "status-dot";

      }


      text.textContent =
        message;

    }


    // ------------------------------------------------------------
    // Clock
    // ------------------------------------------------------------

    function updateTime() {

      const now =
        new Date();


      document.getElementById(
        "timestamp"
      ).textContent =

        now.toTimeString()
          .split(" ")[0];

    }


    // ------------------------------------------------------------
    // Cleanup
    // ------------------------------------------------------------

    window.addEventListener(
      "beforeunload",
      () => {

        if (stream) {

          stream
            .getTracks()
            .forEach(
              track => track.stop()
            );

        }

      }
    );


    // ------------------------------------------------------------
    // Initialize
    // ------------------------------------------------------------

    updateTime();


    setInterval(
      updateTime,
      1000
    );


    startCamera();

  </script>

</body>

</html>
